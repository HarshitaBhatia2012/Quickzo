name: quickzo-2ndyearminiproject

services:
  mysql:
    image: mysql:8.0
    container_name: quickzo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-quickzo}
      MYSQL_USER: ${DB_USERNAME:-quickzo_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-quickzo_password}
    ports:
      - "${DB_EXTERNAL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/quickzo_mysql_migration.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - quickzo-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quickzo-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-quickzo}
      DB_USERNAME: ${DB_USERNAME:-quickzo_user}
      DB_PASSWORD: ${DB_PASSWORD:-quickzo_password}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-quickzo}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-quickzo_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-quickzo_password}
    ports:
      - "${BACKEND_PORT:-8081}:8081"
    networks:
      - quickzo-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: quickzo-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - quickzo-network

networks:
  quickzo-network:
    name: quickzo-network
    driver: bridge

volumes:
  mysql_data:
    name: quickzo_mysql_data
