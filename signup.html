<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signup</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background-color: #dcdcdc; /* greyish background */
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .container {
      background-color: #fff;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      padding: 30px 25px;
      width: 100%;
      max-width: 380px;
      text-align: center;
    }

    h2 {
      color: #222;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      background-color:#00a859;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background-color: #444;
    }

    p {
      margin-top: 15px;
      font-size: 14px;
      color: #555;
    }

    a {
      color: #000;
      text-decoration: none;
      font-weight: bold;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Signup</h2>
    <form id="signupForm">
      <input type="text" id="signupUsername" placeholder="Choose Username" required />
      <input type="password" id="signupPassword" placeholder="Choose Password" required />
      <button type="submit">Sign Up</button>
    </form>
    <p>Already a user? <a href="login.html">Go to Login</a></p>
  </div>

  <script>
document.getElementById("signupForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const username = document.getElementById("signupUsername").value;
  const password = document.getElementById("signupPassword").value;

  try {
    // Backend endpoint routed via Nginx reverse proxy
    const response = await fetch("/signup", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password }) // send as JSON
    });

    // Backend returns plain text message
    const message = await response.text();
    alert(message);

    // Redirect to login page on successful signup
    if (message === "User registered successfully!") {
      window.location.href = "login.html";
    }
  } catch (error) {
    console.error("Signup error:", error);
    alert("Error connecting to server.");
  }
});
</script>

</body>
</html>
