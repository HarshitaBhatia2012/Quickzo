define host {
    use                 generic-host
    host_name           quickzo-frontend
    alias               Quickzo Frontend
    address             quickzo-frontend
    max_check_attempts  3
    check_interval      5
    check_period        24x7
    check_command       check-host-alive
}

define service {
    use                 generic-service
    host_name           quickzo-frontend
    service_description Frontend HTTP
    check_command       check_quickzo_frontend
}

define host {
    use                 generic-host
    host_name           quickzo-backend
    alias               Quickzo Backend
    address             quickzo-backend
    max_check_attempts  3
    check_interval      5
    check_period        24x7
    check_command       check-host-alive
}

define service {
    use                 generic-service
    host_name           quickzo-backend
    service_description Backend Port 8081
    check_command       check_tcp!8081
}

define host {
    use                 generic-host
    host_name           quickzo-mysql
    alias               Quickzo MySQL
    address             quickzo-mysql
    max_check_attempts  3
    check_interval      5
    check_period        24x7
    check_command       check-host-alive
}

define service {
    use                 generic-service
    host_name           quickzo-mysql
    service_description MySQL Port 3306
    check_command       check_tcp!3306
}
